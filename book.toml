[book]
authors = ["ojn"]
language = "en"
description = "ojn's plain text notes"
src = "src"
title = "www.ojn.ovh"

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/ojn/www.ojn.ovh"
git-repository-icon = "fab-github"

[output.html.search]
enable = false

[output.html.print]
enable = false

[output.html.playground]
editable = false
runnable = false

[build]
build-dir = "docs"
create-missing = true
